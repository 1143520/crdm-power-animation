<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>控制棒驱动机构电源（机组式）· 数字孪生剖视</title>
<style>
:root{--bg:#080d16;--panel:#0f1726;--line:#1b2942;--txt:#dfe8f6;--dim:#8798b3;--accent:#4da3ff}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1400px 800px at 50% -20%,#13203a,#070b13 65%);color:var(--txt);font-family:"Noto Sans CJK SC","Noto Sans SC",system-ui,sans-serif}
header{padding:14px 22px 4px;text-align:center}
h1{font-size:20px;margin:0 0 4px;font-weight:600;letter-spacing:.4px}
.sub{color:var(--dim);font-size:12.5px}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;padding:8px 16px 132px;max-width:1620px;margin:0 auto}
@media(max-width:1150px){.wrap{grid-template-columns:1fr}}
.card{background:linear-gradient(180deg,rgba(20,31,49,.95),rgba(11,17,28,.95));border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 34px rgba(0,0,0,.4)}
#stage{padding:4px 8px}
svg{display:block;width:100%;height:auto}
.panel{padding:14px}
.panel h3{margin:0 0 10px;font-size:13.5px;color:var(--accent);letter-spacing:.4px}
.gauge{margin-bottom:11px}
.gauge .label{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-bottom:3px}
.gauge .barwrap{height:7px;background:#141f33;border-radius:5px;overflow:hidden}
.gauge .bar{height:100%;width:0%;border-radius:5px;transition:width .15s linear}
.state-row{display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0;border-bottom:1px dashed #182540}
.state-row span:last-child{font-variant-numeric:tabular-nums;color:#fff}
#caption{position:fixed;left:0;right:0;bottom:0;padding:12px 20px 14px;background:linear-gradient(0deg,rgba(5,8,14,.98),rgba(5,8,14,.8) 72%,transparent)}
#caption .idx{font-size:11.5px;color:var(--accent);letter-spacing:1px;margin-bottom:3px}
#caption .txt{font-size:14.5px;line-height:1.5;max-width:1500px}
#caption .txt b{color:#fff}
.controls{display:flex;align-items:center;gap:9px;margin-top:9px}
button{background:#18263d;color:var(--txt);border:1px solid #27395a;border-radius:8px;padding:6px 13px;font-size:12.5px;cursor:pointer;transition:.15s}
button:hover{background:#21324d;border-color:#37527c}
button.primary{background:#16457c;border-color:#2a67b3}
input[type=range]{flex:1;accent-color:var(--accent)}
.timeline{display:flex;gap:4px;margin-top:9px}
.timeline div{flex:1;height:4px;border-radius:3px;background:#182540;cursor:pointer;transition:.2s}
.timeline div.on{background:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:9px;font-size:11.5px;color:var(--dim);margin-top:10px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
</style>
</head>
<body>
<header>
  <h1>控制棒驱动机构电源（机组式）· 数字孪生剖视</h1>
  <div class="sub">电动机—飞轮—发电机组 → 三相母线 → 棒电源柜/逻辑柜 → CRDM 三组线圈 → 控制棒步进与落棒</div>
</header>

<div class="wrap">
  <div class="card" id="stage">
    <svg viewBox="0 0 1200 820" id="svg">
      <defs>
        <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#43607f"/><stop offset=".45" stop-color="#2b4059"/><stop offset="1" stop-color="#16232f"/></linearGradient>
        <linearGradient id="steelH" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1a2836"/><stop offset=".35" stop-color="#3d5772"/><stop offset=".6" stop-color="#4e6b89"/><stop offset="1" stop-color="#182531"/></linearGradient>
        <linearGradient id="cab" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#39495c"/><stop offset="1" stop-color="#1d2836"/></linearGradient>
        <linearGradient id="concrete" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a3038"/><stop offset="1" stop-color="#171c22"/></linearGradient>
        <linearGradient id="vessel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#26333f"/><stop offset=".4" stop-color="#4b6376"/><stop offset=".75" stop-color="#334552"/><stop offset="1" stop-color="#1b252e"/></linearGradient>
        <linearGradient id="rodMetal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#556a83"/><stop offset=".45" stop-color="#c3d4e6"/><stop offset="1" stop-color="#5b7089"/></linearGradient>
        <linearGradient id="coilHot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f7fd4"/><stop offset=".5" stop-color="#8ad0ff"/><stop offset="1" stop-color="#2f7fd4"/></linearGradient>
        <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4da3ff" stop-opacity="0"/><stop offset=".5" stop-color="#6fc0ff"/><stop offset="1" stop-color="#4da3ff" stop-opacity="0"/></linearGradient>
        <radialGradient id="coreGlow"><stop offset="0" stop-color="#ff8a3d" stop-opacity=".6"/><stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/></radialGradient>
        <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <filter id="soft"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".5"/></filter>
        <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6fc0ff"/></marker>
      </defs>

      <text x="40" y="42" font-size="13" fill="#6d82a3" letter-spacing="1">① 棒电源机组（M-G SET）</text>
      <text x="600" y="42" font-size="13" fill="#6d82a3" letter-spacing="1">② 三相母线 · 棒电源柜 · 逻辑柜</text>
      <text x="905" y="42" font-size="13" fill="#6d82a3" letter-spacing="1">③ 压力容器顶盖 / CRDM</text>

      <!-- ① 机组 -->
      <g id="mgsG" filter="url(#soft)">
        <rect x="40" y="286" width="520" height="26" rx="3" fill="url(#concrete)" stroke="#2b3540"/>
        <rect x="46" y="312" width="508" height="10" fill="#141a20" opacity=".9"/>
        <rect x="58" y="238" width="484" height="52" rx="4" fill="url(#steel)" stroke="#22313f"/>
        <g stroke="#0e151c" stroke-width="2" opacity=".55">
          <path d="M80 238 V290 M120 238 V290 M160 238 V290 M200 238 V290 M240 238 V290 M280 238 V290 M320 238 V290 M360 238 V290 M400 238 V290 M440 238 V290 M480 238 V290 M520 238 V290"/>
        </g>
        <g id="motorG">
          <rect x="76" y="150" width="150" height="90" rx="12" fill="url(#steelH)" stroke="#243342"/>
          <rect x="70" y="158" width="12" height="74" rx="4" fill="#2b3f52" stroke="#1b2836"/>
          <g stroke="#16212c" stroke-width="2" opacity=".8"><path d="M92 152 V238 M104 152 V238 M116 152 V238 M128 152 V238 M140 152 V238 M152 152 V238 M164 152 V238 M176 152 V238 M188 152 V238 M200 152 V238"/></g>
          <rect x="104" y="122" width="70" height="30" rx="4" fill="#31465c" stroke="#1e2c3a"/>
          <path d="M112 122 V112 M166 122 V112" stroke="#4a6076" stroke-width="3"/>
          <g id="motorRotor">
            <circle cx="151" cy="195" r="26" fill="none" stroke="#3b5570" stroke-width="2"/>
            <path d="M151 173 V195 L169 206" stroke="#6fc0ff" stroke-width="3" stroke-linecap="round"/>
          </g>
        </g>
        <rect x="226" y="176" width="46" height="44" rx="6" fill="url(#cab)" stroke="#26364a"/>
        <text x="249" y="164" text-anchor="middle" font-size="10" fill="#5f7590">联轴器</text>
        <g id="flyG">
          <circle cx="330" cy="196" r="62" fill="#1b2836" stroke="#2b3f52" stroke-width="3"/>
          <circle cx="330" cy="196" r="52" fill="url(#steelH)" stroke="#3a5470" stroke-width="2"/>
          <g id="flyMark"><path d="M330 144 V196" stroke="#ffb020" stroke-width="5" stroke-linecap="round"/><circle cx="330" cy="196" r="9" fill="#0f1720" stroke="#4a6076" stroke-width="2"/></g>
          <text x="330" y="276" text-anchor="middle" font-size="10.5" fill="#7f96b8">飞轮（惯性储能）</text>
        </g>
        <g id="genG">
          <rect x="404" y="150" width="150" height="90" rx="12" fill="url(#steelH)" stroke="#243342"/>
          <rect x="548" y="158" width="12" height="74" rx="4" fill="#2b3f52" stroke="#1b2836"/>
          <g stroke="#16212c" stroke-width="2" opacity=".8"><path d="M420 152 V238 M432 152 V238 M444 152 V238 M456 152 V238 M468 152 V238 M480 152 V238 M492 152 V238 M504 152 V238 M516 152 V238 M528 152 V238"/></g>
          <path d="M452 195 l18 -18 18 18 -18 18 z" fill="none" stroke="#37d67a" stroke-width="2.5"/>
          <rect x="436" y="110" width="86" height="40" rx="4" fill="#31465c" stroke="#1e2c3a"/>
          <text x="479" y="135" text-anchor="middle" font-size="10" fill="#9fb6cf">出线箱</text>
          <path d="M452 110 V96 M470 110 V96 M488 110 V96 M506 110 V96" stroke="#4a6076" stroke-width="3"/>
        </g>
        <rect x="252" y="300" width="180" height="18" rx="3" fill="#0f1620" stroke="#26364a"/>
        <text x="342" y="313" text-anchor="middle" font-size="9.5" fill="#6d82a3">棒电源机组 · 3φ 380V</text>
        <text x="151" y="132" text-anchor="middle" font-size="10.5" fill="#8ba0bd">驱动电动机</text>
        <text x="479" y="106" text-anchor="middle" font-size="10.5" fill="#8ba0bd" transform="translate(0,-22)">交流发电机</text>
      </g>

      <g id="gridG">
        <path d="M40 196 H74" stroke="#33507c" stroke-width="4"/>
        <rect x="6" y="176" width="36" height="40" rx="4" fill="#1b2836" stroke="#2b3f52"/>
        <text x="24" y="200" text-anchor="middle" font-size="10.5" fill="#cfe0f5">6kV</text>
        <text x="24" y="240" text-anchor="middle" font-size="10" fill="#8ba0bd" id="gridState">带电</text>
      </g>

      <!-- ② 母线 + 柜列 -->
      <g id="busG">
        <rect x="566" y="150" width="120" height="96" rx="4" fill="none" stroke="#2b3f52" stroke-width="2"/>
        <path d="M574 170 H678 M574 196 H678 M574 222 H678" stroke="#3a5470" stroke-width="5"/>
        <path d="M580 170 H660" stroke="url(#flow)" stroke-width="6" id="flowToBus" opacity="0"/>
        <text x="626" y="266" text-anchor="middle" font-size="10.5" fill="#7f96b8">三相交流母线桥架</text>
        <path d="M686 196 H706" stroke="#6fc0ff" stroke-width="3" marker-end="url(#arw)" id="busArrow" opacity="0"/>
      </g>

      <g id="cabG" filter="url(#soft)">
        <g><rect x="712" y="140" width="62" height="176" rx="4" fill="url(#cab)" stroke="#26364a"/>
          <rect x="718" y="148" width="50" height="70" rx="3" fill="#141d28" stroke="#2b3f52"/>
          <circle cx="733" cy="236" r="4" fill="#37d67a" id="led1"/><circle cx="748" cy="236" r="4" fill="#2b3f52" id="led2"/>
          <text x="743" y="330" text-anchor="middle" font-size="10" fill="#7f96b8">进线柜</text></g>
        <g><rect x="782" y="130" width="76" height="186" rx="4" fill="url(#cab)" stroke="#2f4763"/>
          <rect x="789" y="139" width="62" height="54" rx="3" fill="#0e1622" stroke="#37527c"/>
          <text x="820" y="172" text-anchor="middle" font-size="11" fill="#6fc0ff">棒电源</text>
          <circle cx="803" cy="206" r="4" fill="#4da3ff"/><circle cx="820" cy="206" r="4" fill="#37d67a"/><circle cx="837" cy="206" r="4" fill="#2b3f52"/>
          <g stroke="#22303f" stroke-width="1.5"><path d="M790 222 H850 M790 232 H850 M790 242 H850 M790 252 H850"/></g>
          <text x="820" y="330" text-anchor="middle" font-size="10" fill="#7f96b8">配电 / 整流</text></g>
        <g><rect x="866" y="130" width="76" height="186" rx="4" fill="url(#cab)" stroke="#2f4763"/>
          <rect x="873" y="139" width="62" height="54" rx="3" fill="#0e1622" stroke="#37527c"/>
          <text x="904" y="172" text-anchor="middle" font-size="11" fill="#6fc0ff">逻辑柜</text>
          <g stroke="#22303f" stroke-width="1.5"><path d="M874 202 H932 M874 214 H932 M874 226 H932 M874 238 H932 M874 250 H932"/></g>
          <text x="904" y="330" text-anchor="middle" font-size="10" fill="#7f96b8">程序 / 时序</text></g>
        <path d="M696 196 H710" stroke="#6fc0ff" stroke-width="2" opacity=".5"/>
        <path d="M858 200 H866" stroke="#6fc0ff" stroke-width="2" opacity=".5"/>
      </g>

      <path d="M942 220 H900 V300 H980" stroke="#31465c" stroke-width="4" fill="none"/>
      <path d="M942 220 H900 V300 H980" stroke="#6fc0ff" stroke-width="2" fill="none" id="cableFlow" opacity="0"/>

      <!-- ③ 压力容器顶盖 -->
      <g id="vesselG" filter="url(#soft)">
        <path d="M980 300 q90 -70 180 0 v34 H980 z" fill="url(#vessel)" stroke="#2b3f52" stroke-width="2"/>
        <ellipse cx="1070" cy="300" rx="90" ry="26" fill="#3a4f60" stroke="#4a6577" opacity=".55"/>
        <rect x="972" y="334" width="196" height="16" rx="3" fill="#22303f" stroke="#2b3f52"/>
        <g stroke="#3a5470" stroke-width="3" fill="#1e2a36">
          <rect x="1006" y="238" width="14" height="62" rx="3"/>
          <rect x="1063" y="228" width="14" height="72" rx="3" id="crdmCenter"/>
          <rect x="1120" y="238" width="14" height="62" rx="3"/>
        </g>
        <rect x="1058" y="216" width="24" height="14" rx="3" fill="#31465c" stroke="#4a6577"/>
        <text x="1070" y="380" text-anchor="middle" font-size="10.5" fill="#7f96b8">压力容器顶盖</text>
        <text x="1070" y="396" text-anchor="middle" font-size="10" fill="#5d7391">CRDM 驱动机构</text>
      </g>
      <circle cx="1070" cy="232" r="34" fill="none" stroke="#4da3ff" stroke-width="1.6" stroke-dasharray="4 4" opacity=".75"/>
      <path d="M1040 258 C1000 320, 780 360, 700 372" stroke="#37527c" stroke-width="1.4" stroke-dasharray="5 5" fill="none"/>

      <line x1="40" y1="416" x2="1160" y2="416" stroke="#1b2942" stroke-width="1.5"/>
      <text x="40" y="404" font-size="12" fill="#4f6b8c">④ CRDM 剖视放大（三组线圈 · 双爪 · 驱动杆 · 缓冲器）</text>

      <!-- ④ CRDM 剖面 -->
      <g id="rodG">
        <rect x="524" y="430" width="16" height="316" fill="url(#vessel)" stroke="#33465a"/>
        <rect x="660" y="430" width="16" height="316" fill="url(#vessel)" stroke="#33465a"/>
        <text x="600" y="424" text-anchor="middle" font-size="10.5" fill="#7f96b8">CRDM 耐压壳 / 套管</text>

        <g id="coilsG">
          <g id="coilL">
            <rect x="546" y="446" width="108" height="34" rx="6" fill="#16233a" stroke="#3a5480" stroke-width="1.5"/>
            <rect x="546" y="446" width="108" height="34" rx="6" fill="url(#coilHot)" opacity="0" id="coilLglow" filter="url(#glow)"/>
            <text x="600" y="469" text-anchor="middle" font-size="11" fill="#cfe0f5">提升线圈 L</text>
          </g>
          <g id="coilM">
            <rect x="546" y="494" width="108" height="34" rx="6" fill="#16233a" stroke="#3a5480" stroke-width="1.5"/>
            <rect x="546" y="494" width="108" height="34" rx="6" fill="url(#coilHot)" opacity="0" id="coilMglow" filter="url(#glow)"/>
            <text x="600" y="517" text-anchor="middle" font-size="11" fill="#cfe0f5">移动线圈 M</text>
          </g>
          <g id="coilS">
            <rect x="546" y="542" width="108" height="34" rx="6" fill="#16233a" stroke="#3a5480" stroke-width="1.5"/>
            <rect x="546" y="542" width="108" height="34" rx="6" fill="url(#coilHot)" opacity="0" id="coilSglow" filter="url(#glow)"/>
            <text x="600" y="565" text-anchor="middle" font-size="11" fill="#cfe0f5">保持线圈 S</text>
          </g>
        </g>

        <rect x="591" y="440" width="18" height="320" rx="3" fill="url(#rodMetal)" id="driveRod"/>
        <g id="teeth" stroke="#0d141d" stroke-width="1.6" opacity=".65">
          <path d="M589 470 H611 M589 488 H611 M589 506 H611 M589 524 H611 M589 542 H611 M589 560 H611 M589 578 H611 M589 596 H611 M589 614 H611 M589 632 H611"/>
        </g>

        <g id="claws">
          <path d="M586 486 L600 496 L614 486" stroke="#ffb020" stroke-width="2.6" fill="none"/>
          <path d="M586 534 L600 544 L614 534" stroke="#37d67a" stroke-width="2.6" fill="none"/>
          <text x="452" y="492" font-size="10" fill="#ffb020" text-anchor="end">移动爪</text>
          <text x="452" y="540" font-size="10" fill="#37d67a" text-anchor="end">保持爪</text>
          <path d="M456 490 H582" stroke="#ffb020" stroke-width="1" stroke-dasharray="3 3" opacity=".45"/>
          <path d="M456 538 H582" stroke="#37d67a" stroke-width="1" stroke-dasharray="3 3" opacity=".45"/>
        </g>

        <rect x="520" y="700" width="160" height="62" rx="6" fill="#0f1720" stroke="#2b3d5e"/>
        <g id="fluxG" opacity=".3"><ellipse cx="600" cy="731" rx="74" ry="26" fill="url(#coreGlow)"/></g>
        <text x="692" y="736" font-size="10" fill="#6d82a3">堆芯</text>

        <rect x="566" y="766" width="68" height="16" rx="5" fill="#2a2233" stroke="#5b3f6b" stroke-width="1.5" id="buffer"/>
        <text x="648" y="779" font-size="10" fill="#8b6f9b">缓冲器</text>

        <g font-size="9.5" fill="#4f6b8c">
          <line x1="712" y1="446" x2="712" y2="700" stroke="#24344f"/>
          <path d="M708 446 H716 M708 573 H716 M708 700 H716"/>
          <text x="722" y="450">顶</text><text x="722" y="577">中</text><text x="722" y="704">底</text>
        </g>
        <text x="600" y="806" text-anchor="middle" font-size="10.5" fill="#5d7391" id="badgeStage">阶段：待机</text>
      </g>
    </svg>
  </div>

  <div class="card panel">
    <h3>实时状态</h3>
    <div class="gauge"><div class="label"><span>飞轮转速</span><span id="vRpm">1500</span></div>
      <div class="barwrap"><div class="bar" id="bRpm" style="background:linear-gradient(90deg,#4da3ff,#7cc4ff)"></div></div></div>
    <div class="gauge"><div class="label"><span>母线电压</span><span id="vVolt">380 V</span></div>
      <div class="barwrap"><div class="bar" id="bVolt" style="background:linear-gradient(90deg,#37d67a,#7ff0ad)"></div></div></div>
    <div class="gauge"><div class="label"><span>飞轮储能</span><span id="vE">100%</span></div>
      <div class="barwrap"><div class="bar" id="bE" style="background:linear-gradient(90deg,#ffb020,#ffd479)"></div></div></div>
    <div class="gauge"><div class="label"><span>控制棒提出高度</span><span id="vRod">30%</span></div>
      <div class="barwrap"><div class="bar" id="bRod" style="background:linear-gradient(90deg,#4da3ff,#8fd7ff)"></div></div></div>
    <div style="margin-top:12px">
      <div class="state-row"><span>提升线圈 L</span><span id="sL">断电</span></div>
      <div class="state-row"><span>移动线圈 M</span><span id="sM">断电</span></div>
      <div class="state-row"><span>保持线圈 S</span><span id="sS">断电</span></div>
      <div class="state-row"><span>堆芯中子注量</span><span id="sFlux">100%</span></div>
    </div>
    <div class="legend">
      <span><i style="background:#4da3ff"></i>线圈通电</span>
      <span><i style="background:#ffb020"></i>移动爪 / 飞轮</span>
      <span><i style="background:#37d67a"></i>保持爪</span>
      <span><i style="background:#ff5c5c"></i>落棒</span>
    </div>
  </div>
</div>

<div id="caption">
  <div class="idx" id="capIdx">第 1 章 / 9</div>
  <div class="txt" id="capTxt">准备中…</div>
  <div class="controls">
    <button id="btnPlay" class="primary">暂停</button>
    <button id="btnPrev">上一章</button>
    <button id="btnNext">下一章</button>
    <input type="range" id="scrub" min="0" max="1000" value="0">
    <span id="clock" style="font-variant-numeric:tabular-nums;color:#8ba0bd;font-size:12px">0.0s</span>
  </div>
  <div class="timeline" id="tl"></div>
</div>

<script>
const SCRIPT=[
 {t:[0,8],title:"设备组成",text:"机组式棒电源是一台<b>卧式 M-G 机组</b>：驱动电动机、飞轮、交流发电机同轴，装在共用底架上。输出三相交流经<b>母线桥架</b>送到棒电源柜与逻辑柜，整流成直流供 CRDM 三组线圈。"},
 {t:[8,16],title:"机组启动建压",text:"6kV 厂用电投入，电动机拖动同轴机组升速；<b>飞轮随轴储存动能</b>，发电机建压到额定值，逻辑柜自检后进入待命。"},
 {t:[16,26],title:"保持爪抓住驱动杆",text:"逻辑柜先给<b>保持线圈 S</b> 通直流电，保持爪在电磁力下吸合、卡入驱动杆齿槽——控制棒被牢牢提住，不会下滑。"},
 {t:[26,36],title:"移动爪挂入下一齿",text:"<b>移动线圈 M</b> 通电，移动爪上移并挂入上一个齿槽。上下两副爪交替受力，形成<b>倒手</b>结构，这是磁力提升式的核心。"},
 {t:[36,46],title:"提升一步（约 10mm）",text:"<b>提升线圈 L</b> 通电产生提升力，驱动杆整体上提一个齿距。棒位上升，堆芯中子注量随之增加。"},
 {t:[46,56],title:"倒手完成 · 循环往复",text:"保持爪接住新齿位后，M、L 依次失电，移动爪回落复位。<b>提—挂—松循环</b>每完成一次，控制棒上升一步，逐齿提升到目标棒位。"},
 {t:[56,68],title:"失电 · 飞轮惯性维持",text:"厂用电突然失去，电动机失去动力，但<b>飞轮惯性</b>继续拖动发电机：母线仍有电压、线圈电流不中断，控制棒<b>保持原位不误落</b>，为停堆操作争取时间。"},
 {t:[68,82],title:"落棒停堆",text:"失电持续或收到停堆信号时，逻辑柜<b>切断三组线圈电流</b>，双爪失磁释放，控制棒靠重力快速落入堆芯，由<b>缓冲器</b>吸收冲击——反应堆紧急停堆。"},
 {t:[82,92],title:"小结",text:"机组式棒电源靠<b>旋转惯量</b>抵御短时失电，靠<b>失磁落棒</b>保证停堆安全：既要稳住棒，也要在需要时果断放开棒。"}
];
const TOTAL=SCRIPT[SCRIPT.length-1].t[1];
let t=0,playing=true,last=performance.now();
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,k)=>a+(b-a)*k;
const seg=vv=>{let i=0;SCRIPT.forEach((s,k)=>{if(vv>=s.t[0])i=k;});return i;};
const tl=$('tl');
SCRIPT.forEach((s,i)=>{const d=document.createElement('div');d.title=s.title;
 d.onclick=()=>{t=s.t[0]+0.01;playing=true;$('btnPlay').textContent='暂停';};tl.appendChild(d);});
const tld=[...tl.children];

function update(){
 const lossPhase=t>=56&&t<68, dropPhase=t>=68&&t<82, afterDrop=t>=82;
 let rpm=0;
 if(t<8)rpm=0; else if(t<16)rpm=lerp(0,1500,(t-8)/8);
 else if(t<56)rpm=1500; else if(lossPhase)rpm=lerp(1500,820,(t-56)/12);
 else rpm=lerp(820,0,clamp((t-68)/12,0,1));
 const volt=rpm>50?Math.round(380*(rpm/1500)):0;
 const energy=clamp(Math.pow(rpm/1500,2)*100,0,100);

 let L=false,M=false,S=false;
 if(t>=16&&t<26){S=true;}
 else if(t>=26&&t<36){S=true;M=true;}
 else if(t>=36&&t<46){S=true;M=true;L=true;}
 else if(t>=46&&t<56){S=true;}
 else if(lossPhase){S=true;}

 let rod=30;
 if(t>=26&&t<56)rod=30+(t-26)/30*58; else if(t>=56)rod=88;
 if(dropPhase)rod=lerp(88,4,Math.pow(clamp((t-68)/9,0,1),1.6));
 if(afterDrop)rod=4;
 const flux=clamp(100-(100-rod)*1.05,4,100);

 $('motorRotor').style.transformOrigin='151px 195px';
 $('motorRotor').style.transform=`rotate(${(t*rpm*0.05)%360}deg)`;
 $('flyMark').style.transformOrigin='330px 196px';
 $('flyMark').style.transform=`rotate(${(t*rpm*0.06)%360}deg)`;

 $('gridState').textContent=lossPhase?'失电':(t>=8?'带电':'未投入');
 $('gridState').setAttribute('fill',lossPhase?'#ff5c5c':'#8ba0bd');
 $('flowToBus').setAttribute('opacity',(t>=8&&!dropPhase)?0.95:0);
 $('busArrow').setAttribute('opacity',(t>=8&&!dropPhase)?1:0);
 $('cableFlow').setAttribute('opacity',(t>=16&&!dropPhase)?0.8:0);

 const gl=(id,on)=>{const e=$(id);if(e)e.setAttribute('opacity',on?0.45:0);};
 gl('coilLglow',L);gl('coilMglow',M);gl('coilSglow',S);
 $('led1').setAttribute('fill',volt>200?'#37d67a':'#ff5c5c');
 $('led2').setAttribute('fill',(S||M||L)?'#4da3ff':'#2b3f52');

 const rodBottom=lerp(752,636,rod/100);
 const rodTop=rodBottom-300;
 $('driveRod').setAttribute('y',rodTop);
 $('teeth').setAttribute('transform',`translate(0,${(rodTop-440)*0.6})`);
 $('claws').setAttribute('transform',`translate(0,${(rodTop-440)*0.35})`);

 const hit=dropPhase?clamp(1-Math.abs(rod-6)/22,0,1):0;
 const buf=$('buffer');
 buf.setAttribute('stroke',hit>0.05?'#ff5c5c':'#5b3f6b');
 buf.setAttribute('fill',hit>0.05?`rgba(255,92,92,${0.18*hit+0.08})`:'#2a2233');
 $('fluxG').setAttribute('opacity',(0.1+flux/100*0.75).toFixed(2));

 $('vRpm').textContent=Math.round(rpm);$('bRpm').style.width=(rpm/1500*100)+'%';
 $('vVolt').textContent=volt>10?volt+' V':'0 V';$('bVolt').style.width=(volt/380*100)+'%';
 $('vE').textContent=Math.round(energy)+'%';$('bE').style.width=energy+'%';
 $('vRod').textContent=Math.round(rod)+'%';$('bRod').style.width=rod+'%';
 $('sL').textContent=L?'通电':'断电';$('sL').style.color=L?'#4da3ff':'#8ba0bd';
 $('sM').textContent=M?'通电':'断电';$('sM').style.color=M?'#4da3ff':'#8ba0bd';
 $('sS').textContent=S?'通电':'断电';$('sS').style.color=S?'#4da3ff':'#8ba0bd';
 $('sFlux').textContent=Math.round(flux)+'%';
 $('sFlux').style.color=flux<60?'#ff5c5c':'#37d67a';

 const i=seg(t);
 $('capIdx').textContent=`第 ${i+1} 章 / ${SCRIPT.length} · ${SCRIPT[i].title}`;
 $('capTxt').innerHTML=SCRIPT[i].text;
 tld.forEach((d,k)=>d.classList.toggle('on',k<=i));
 $('badgeStage').textContent='阶段：'+SCRIPT[i].title;
 $('clock').textContent=t.toFixed(1)+'s';
 $('scrub').value=t/TOTAL*1000;
}
function loop(now){
 const dt=Math.min((now-last)/1000,0.1);last=now;
 if(playing){t+=dt;if(t>=TOTAL)t=0;}
 update();requestAnimationFrame(loop);
}
$('btnPlay').onclick=()=>{playing=!playing;$('btnPlay').textContent=playing?'暂停':'播放';};
$('btnPrev').onclick=()=>{const i=Math.max(0,seg(t)-1);t=SCRIPT[i].t[0]+0.01;};
$('btnNext').onclick=()=>{const i=Math.min(SCRIPT.length-1,seg(t)+1);t=SCRIPT[i].t[0]+0.01;};
$('scrub').oninput=e=>{t=e.target.value/1000*TOTAL;playing=false;$('btnPlay').textContent='播放';};
window.__anim={set:v=>{t=v;update();},total:TOTAL,script:SCRIPT.length};
requestAnimationFrame(loop);
</script>
</body>
</html>
