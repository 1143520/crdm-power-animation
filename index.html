<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>控制棒驱动机构电源（机组式）· 等轴测数字孪生</title>
<style>
:root{--bg:#060a11;--line:#17243a;--txt:#e2ebf8;--dim:#8496b0;--accent:#4da3ff;--ok:#37d67a;--warn:#ffb020;--bad:#ff5c5c}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1500px 900px at 50% -25%,#11203a,#05080e 68%);color:var(--txt);font-family:"Noto Sans CJK SC","Noto Sans SC",system-ui,sans-serif}
h1{font-size:19px;margin:14px 0 3px;text-align:center;font-weight:600;letter-spacing:.5px}
.sub{color:var(--dim);font-size:12px;text-align:center;margin-bottom:6px}
.stage{max-width:1560px;margin:0 auto;padding:0 14px 150px}
svg{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,#0a1220,#070c14)}
.panelbar{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:10px}
.kpi{background:#0d1726;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.kpi .k{font-size:11px;color:var(--dim)}
.kpi .v{font-size:17px;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .v small{font-size:11px;color:var(--dim);margin-left:2px}
#caption{position:fixed;left:0;right:0;bottom:0;padding:11px 20px 13px;background:linear-gradient(0deg,rgba(4,7,12,.98),rgba(4,7,12,.78) 72%,transparent)}
#caption .idx{font-size:11.5px;color:var(--accent);letter-spacing:1px}
#caption .txt{font-size:14px;line-height:1.5;margin-top:2px}
#caption .txt b{color:#fff}
.controls{display:flex;gap:8px;align-items:center;margin-top:8px}
button{background:#152238;color:var(--txt);border:1px solid #23344f;border-radius:8px;padding:6px 12px;font-size:12.5px;cursor:pointer}
button:hover{background:#1c2c46}
button.primary{background:#154377;border-color:#2a67b3}
input[type=range]{flex:1;accent-color:var(--accent)}
.tl{display:flex;gap:4px;margin-top:8px}
.tl div{flex:1;height:4px;border-radius:3px;background:#16233a;cursor:pointer}
.tl div.on{background:var(--accent)}
/* 悬停提示 */
#tip{position:absolute;pointer-events:none;background:rgba(10,18,30,.96);border:1px solid #2a4a72;
  border-radius:8px;padding:8px 12px;font-size:12px;line-height:1.55;max-width:290px;color:#d7e6f8;
  box-shadow:0 6px 24px rgba(0,0,0,.6);opacity:0;transition:opacity .12s;z-index:50}
#tip b{color:#8ed4ff}
.hot{cursor:help}
.hot:hover{filter:brightness(1.35)}
#btnPng{background:#173a26;border-color:#2a6b45}
</style>
</head>
<body>
<h1>控制棒驱动机构电源（机组式）· 等轴测数字孪生</h1>
<div class="sub">机房布置 · M-G 机组 → 母线 → 棒电源柜/逻辑柜 → CRDM 三组线圈 · 步进提棒与失电落棒</div>

<div class="stage">
<svg viewBox="0 0 1440 980" id="svg">
  <defs>
    <linearGradient id="gnd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#122033"/><stop offset="1" stop-color="#070d16"/></linearGradient>
    <linearGradient id="rodfill" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4a5f79"/><stop offset=".45" stop-color="#cfdced"/><stop offset="1" stop-color="#4f6580"/></linearGradient>
    <linearGradient id="coilOn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b7ed2"/><stop offset=".5" stop-color="#8ed4ff"/><stop offset="1" stop-color="#2b7ed2"/></linearGradient>
    <linearGradient id="flowline" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4da3ff" stop-opacity="0"/><stop offset=".5" stop-color="#8ed4ff"/><stop offset="1" stop-color="#4da3ff" stop-opacity="0"/></linearGradient>
    <radialGradient id="coreglow"><stop offset="0" stop-color="#ff8a3d" stop-opacity=".7"/><stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/></radialGradient>
    <filter id="fglow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="fsh"><feDropShadow dx="2" dy="6" stdDeviation="7" flood-color="#000" flood-opacity=".55"/></filter>
    <marker id="arw" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7cc4ff"/></marker>
  </defs>

  <!-- 地面与分区 -->
  <rect x="20" y="46" width="1400" height="520" rx="12" fill="url(#gnd)" stroke="#152238"/>
  <text x="46" y="76" font-size="12.5" fill="#5f7796" letter-spacing="1">厂房布置（等轴测）· 悬停设备查看说明</text>
  <g id="plant"></g>
  <g id="plantLabels"></g>

  <!-- 下部三栏 -->
  <line x1="20" y1="590" x2="1420" y2="590" stroke="#152238"/>
  <text x="46" y="618" font-size="12.5" fill="#5f7796" letter-spacing="1">CRDM 剖视放大</text>
  <text x="586" y="618" font-size="12.5" fill="#5f7796" letter-spacing="1">运行流程图</text>
  <text x="1156" y="618" font-size="12.5" fill="#5f7796" letter-spacing="1">线圈电流 / 母线电压</text>

  <!-- CRDM 剖面 -->
  <g id="rodG">
    <rect x="40" y="632" width="520" height="320" rx="10" fill="#0a1320" stroke="#152238"/>
    <rect x="248" y="646" width="14" height="292" fill="#2a3a4c" stroke="#3a4f66"/>
    <rect x="366" y="646" width="14" height="292" fill="#2a3a4c" stroke="#3a4f66"/>
    <text x="314" y="640" font-size="10" fill="#5f7796" text-anchor="middle">耐压壳</text>

    <g id="coilL"><rect x="266" y="662" width="96" height="26" rx="5" fill="#111d2e" stroke="#31507a"/>
      <rect x="266" y="662" width="96" height="26" rx="5" fill="url(#coilOn)" opacity="0" id="coilLglow" filter="url(#fglow)"/>
      <text x="314" y="680" font-size="10.5" fill="#cfe0f5" text-anchor="middle">提升 L</text></g>
    <g id="coilM"><rect x="266" y="700" width="96" height="26" rx="5" fill="#111d2e" stroke="#31507a"/>
      <rect x="266" y="700" width="96" height="26" rx="5" fill="url(#coilOn)" opacity="0" id="coilMglow" filter="url(#fglow)"/>
      <text x="314" y="718" font-size="10.5" fill="#cfe0f5" text-anchor="middle">移动 M</text></g>
    <g id="coilS"><rect x="266" y="738" width="96" height="26" rx="5" fill="#111d2e" stroke="#31507a"/>
      <rect x="266" y="738" width="96" height="26" rx="5" fill="url(#coilOn)" opacity="0" id="coilSglow" filter="url(#fglow)"/>
      <text x="314" y="756" font-size="10.5" fill="#cfe0f5" text-anchor="middle">保持 S</text></g>

    <rect x="306" y="650" width="16" height="252" rx="2" fill="url(#rodfill)" id="driveRod"/>
    <g id="teeth" stroke="#0a1119" stroke-width="1.5" opacity=".6">
      <path d="M304 676 H324 M304 690 H324 M304 704 H324 M304 718 H324 M304 732 H324 M304 746 H324 M304 760 H324 M304 774 H324 M304 788 H324 M304 802 H324"/>
    </g>
    <g id="claws">
      <path d="M300 694 L314 702 L328 694" stroke="#ffb020" stroke-width="2.4" fill="none"/>
      <path d="M300 732 L314 740 L328 732" stroke="#37d67a" stroke-width="2.4" fill="none"/>
      <text x="196" y="700" font-size="9.5" fill="#ffb020" text-anchor="end">移动爪</text>
      <text x="196" y="738" font-size="9.5" fill="#37d67a" text-anchor="end">保持爪</text>
      <path d="M200 698 H296" stroke="#ffb020" stroke-width=".8" stroke-dasharray="3 3" opacity=".4"/>
      <path d="M200 736 H296" stroke="#37d67a" stroke-width=".8" stroke-dasharray="3 3" opacity=".4"/>
    </g>
    <rect x="240" y="862" width="140" height="52" rx="6" fill="#0c1522" stroke="#24384f"/>
    <g id="fluxG" opacity=".3"><ellipse cx="310" cy="888" rx="62" ry="20" fill="url(#coreglow)"/></g>
    <text x="392" y="890" font-size="9.5" fill="#64798f">堆芯</text>
    <rect x="282" y="920" width="56" height="12" rx="4" fill="#241d2b" stroke="#4d3a5c" id="buffer"/>
    <text x="346" y="931" font-size="9.5" fill="#7d6690">缓冲器</text>
    <g font-size="9" fill="#4b6076"><line x1="440" y1="660" x2="440" y2="862" stroke="#1b2b3f"/>
      <text x="446" y="664">顶</text><text x="446" y="764">中</text><text x="446" y="866">底</text></g>
    <text x="300" y="950" font-size="10" fill="#5a708a" id="badgeStage" text-anchor="middle">待机</text>
  </g>

  <!-- 运行流程图 -->
  <g id="flowG">
    <rect x="580" y="632" width="556" height="320" rx="10" fill="#0a1320" stroke="#152238"/>
    <g id="flowNodes"></g>
  </g>

  <!-- 波形 -->
  <g id="waveG">
    <rect x="1150" y="632" width="250" height="320" rx="10" fill="#0a1320" stroke="#152238"/>
    <foreignObject x="1158" y="640" width="234" height="304">
      <canvas id="wave" width="468" height="608" style="width:234px;height:304px"></canvas>
    </foreignObject>
  </g>
</svg>

<div class="panelbar">
  <div class="kpi"><div class="k">飞轮转速</div><div class="v" id="vRpm">1500<small>rpm</small></div></div>
  <div class="kpi"><div class="k">母线电压</div><div class="v" id="vVolt">380<small>V</small></div></div>
  <div class="kpi"><div class="k">飞轮储能</div><div class="v" id="vE">100<small>%</small></div></div>
  <div class="kpi"><div class="k">控制棒提出</div><div class="v" id="vRod">30<small>%</small></div></div>
  <div class="kpi"><div class="k">线圈状态 L/M/S</div><div class="v" id="vCoil" style="font-size:13px">断 · 断 · 断</div></div>
  <div class="kpi"><div class="k">中子注量</div><div class="v" id="vFlux">32<small>%</small></div></div>
</div>
</div>

<div id="caption">
  <div class="idx" id="capIdx">第 1 章 / 9</div>
  <div class="txt" id="capTxt">准备中…</div>
  <div class="controls">
    <button id="btnPlay" class="primary">暂停</button>
    <button id="btnPrev">上一章</button>
    <button id="btnNext">下一章</button>
    <button id="btnPng" title="导出当前画面为 PNG">导出PNG</button>
    <input type="range" id="scrub" min="0" max="1000" value="0">
    <span id="clock" style="font-variant-numeric:tabular-nums;color:#8496b0;font-size:12px">0.0s</span>
  </div>
  <div class="tl" id="tl"></div>
</div>

<script>
/* ================= 等轴测工具 ================= */
const K = 2.35, OX = 250, OY = 250;
const cos30 = Math.cos(Math.PI/6), sin30 = Math.sin(Math.PI/6);
const iso = (x,y,z) => [ OX + (x - y) * cos30 * K, OY + (x + y) * sin30 * K - z * K ];
const P = (pts,fill,stroke,sw) => `<polygon points="${pts.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ')}" fill="${fill}"${stroke?` stroke="${stroke}" stroke-width="${sw||1}"`:''}/>`;
function box(x,y,z,w,d,h,cTop,cRight,cLeft,edge){
  const A=iso(x,y,z+h),B=iso(x+d,y,z+h),C=iso(x+d,y+w,z+h),D=iso(x,y+w,z+h);
  const E=iso(x+d,y,z),F=iso(x+d,y+w,z),G=iso(x,y+w,z);
  return P([A,B,C,D],cTop,edge)+P([B,C,F,E],cRight,edge)+P([D,C,F,G],cLeft,edge);
}
function cylX(x,y,z,r,len,cFace,cBody,edge){
  const p1=iso(x,y,z), p2=iso(x+len,y,z);
  const rx=r*cos30*K*1.02, ry=r*sin30*K*1.02;
  return `<g><rect x="${p1[0]}" y="${p1[1]-ry}" width="${(p2[0]-p1[0]).toFixed(1)}" height="${(ry*2).toFixed(1)}" fill="${cBody}"/>
    <ellipse cx="${p1[0]}" cy="${p1[1]}" rx="${rx}" ry="${ry}" fill="${cBody}" stroke="${edge}" stroke-width="1"/>
    <ellipse cx="${p2[0]}" cy="${p2[1]}" rx="${rx}" ry="${ry}" fill="${cFace}" stroke="${edge}" stroke-width="1"/></g>`;
}
function cylZ(x,y,z,r,h,cFace,cBody,edge){
  const b=iso(x,y,z), t=iso(x,y,z+h);
  const rx=r*cos30*K*1.02, ry=r*sin30*K*1.02;
  return `<g><path d="M${(b[0]-rx).toFixed(1)} ${b[1].toFixed(1)} v${(t[1]-b[1]).toFixed(1)} a${rx.toFixed(1)} ${ry.toFixed(1)} 0 0 0 ${(rx*2).toFixed(1)} 0 v${(b[1]-t[1]).toFixed(1)} z" fill="${cBody}" stroke="${edge}" stroke-width="1"/>
    <ellipse cx="${t[0]}" cy="${t[1]}" rx="${rx}" ry="${ry}" fill="${cFace}" stroke="${edge}" stroke-width="1"/></g>`;
}
const G = (nodes,attrs='') => `<g ${attrs}>${nodes}</g>`;

/* ================= 场景装配 ================= */
const C = {
  conc:'#1a2029', steelT:'#3b5372', steelR:'#2a3d55', steelL:'#20303f',
  motorT:'#4a6a8c', motorR:'#35506d', motorL:'#253a4f',
  flyT:'#5a7691', flyR:'#3f5a75', flyL:'#2c4157',
  genT:'#42658a', genR:'#2e4c6b', genL:'#21384d',
  cabT:'#3a4b60', cabR:'#28374a', cabL:'#1c2836',
  edge:'#0e1620'
};
let plant = '';
// 地板 + 格栅
plant += P([iso(0,0,0),iso(96,0,0),iso(96,56,0),iso(0,56,0)],'#0d1622','#1b2b3e');
for(let gx=0;gx<=96;gx+=8){
  const a=iso(gx,0,0),b=iso(gx,56,0);
  plant += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#152437" stroke-width=".6" opacity=".55"/>`;
}
for(let gy=0;gy<=56;gy+=8){
  const a=iso(0,gy,0),b=iso(96,gy,0);
  plant += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#152437" stroke-width=".6" opacity=".55"/>`;
}
// 混凝土基础 + 钢底架
plant += box(2,6,0, 92,40,4, C.conc,'#141b24','#101720', C.edge);
plant += box(6,9,4, 84,34,3, '#2d3f52','#243343','#1b2836', C.edge);
// 底架螺栓
[[10,12],[10,40],[88,12],[88,40]].forEach(([bx,by])=>{
  const p=iso(bx,by,7);
  plant += `<circle cx="${p[0]}" cy="${p[1]}" r="2.2" fill="#4a6076" stroke="#0e1620"/>`;
});
// 轴承座
[[14,26],[52,26],[84,26]].forEach(([bx,by])=>{
  plant += box(bx-3,by-4,7, 6,8,4, '#3a4c60','#2a3a4c','#1e2b38', C.edge);
});
// 电动机（带散热筋）
plant += cylX(12,26, 9, 11, 26, C.motorT,C.motorR,C.edge);
plant += G(Array.from({length:11},(_,i)=>{
  const p=iso(15+i*2.3,26,20); return `<line x1="${p[0]-2}" y1="${p[1]-13}" x2="${p[0]-2}" y2="${p[1]+13}" stroke="#182735" stroke-width="1"/>`;
}).join(''));
// 电机风扇罩
plant += cylX(11,26,9, 11.6, 1.6, '#5a7a9c','#3a546e', C.edge);
// 接线盒
plant += box(16,22,20, 12,8,4, '#334a63','#263a4f','#1b2a38', C.edge);
// 联轴器护罩
plant += box(39,20,9, 9,12,6, '#37506b','#2a3d52','#1e2d3d', C.edge);
// 飞轮（大直径厚盘）
plant += cylX(49,26, 9, 17, 5, C.flyT,C.flyR,C.edge);
const flyC = iso(51.5,26,18);
plant += `<circle cx="${flyC[0]}" cy="${flyC[1]}" r="${(17*cos30*K*0.62).toFixed(1)}" fill="none" stroke="#7a97b5" stroke-width="1" opacity=".65"/>`;
// 飞轮旋转标记（动态）
plant += `<g id="flySpin"><line x1="${flyC[0]}" y1="${flyC[1]-18}" x2="${flyC[0]}" y2="${flyC[1]-4}" stroke="#ffb020" stroke-width="4" stroke-linecap="round"/></g>`;
// 发电机
plant += cylX(56,26, 9, 12, 30, C.genT,C.genR,C.edge);
plant += G(Array.from({length:11},(_,i)=>{
  const p=iso(59+i*2.5,26,21); return `<line x1="${p[0]-2}" y1="${p[1]-14}" x2="${p[0]-2}" y2="${p[1]+14}" stroke="#17242f" stroke-width="1"/>`;
}).join(''));
// 发电机励磁端罩
plant += cylX(85,26,9, 10.5, 2.5, '#4a6a90','#31496a', C.edge);
// 出线箱 + 电缆
plant += box(64,20,22, 16,10,5, '#3a5570','#2c4258','#1f3040', C.edge);
// 机组铭牌
plant += box(30,7.2,7.4, 22,0.4,4.5, '#0f1a26','#0a121b','#0a121b', C.edge);
{
  const mp=iso(41,7.0,9.5);
  plant += `<text x="${mp[0]}" y="${mp[1]}" font-size="5.2" fill="#9fb6cf" text-anchor="middle" transform="rotate(-0 ${mp[0]} ${mp[1]})">CRPS-1500 · 3φ380V</text>`;
}
// 母线桥架支撑
plant += box(99,14,9, 12,22,3, '#2b3d52','#223243','#182533', C.edge);
[16,22,28].forEach((zz)=>{ plant += box(99,zz,9, 10,3,1.2, '#4f6f92','#3a5473','#283c52', C.edge); });
// 柜列
plant += box(118,4,0, 16,14,30, C.cabT,C.cabR,C.cabL, C.edge);
plant += box(118,20,0, 18,16,34, C.cabT,C.cabR,C.cabL, C.edge);
plant += box(118,38,0, 18,16,34, C.cabT,C.cabR,C.cabL, C.edge);
// 柜门细节：门缝、观察窗、把手、指示灯
[[118,4,16,14,30],[118,20,18,16,34],[118,38,18,16,34]].forEach(([x,y,w,d,h],ci)=>{
  const a=iso(x,y,h*0.86), b=iso(x+w,y,h*0.86);
  plant += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#16222f" stroke-width="1"/>`;
  // 观察窗
  const wa=iso(x+2,y-0.2,h*0.68), wb=iso(x+w-2,y-0.2,h*0.68), wc=iso(x+w-2,y-0.2,h*0.5), wd=iso(x+2,y-0.2,h*0.5);
  plant += P([wa,wb,wc,wd],'#0e1824','#3a5470',1);
  // 指示灯
  const l1=iso(x+w*0.3,y-0.5,h*0.42), l2=iso(x+w*0.5,y-0.5,h*0.42);
  plant += `<circle id="cabLed${ci}a" cx="${l1[0]}" cy="${l1[1]}" r="1.8" fill="#37d67a"/>`;
  plant += `<circle id="cabLed${ci}b" cx="${l2[0]}" cy="${l2[1]}" r="1.8" fill="#2b3f52"/>`;
  // 门把手
  const hh=iso(x+w-2,y-0.4,h*0.28);
  plant += `<line x1="${hh[0]}" y1="${hh[1]-3}" x2="${hh[0]}" y2="${hh[1]+3}" stroke="#5a7590" stroke-width="1.8"/>`;
});
// 到容器的电缆桥
plant += `<path d="${(()=>{const a=iso(136,46,34),b=iso(150,46,34),c=iso(176,46,20);return `M${a[0]} ${a[1]} L${b[0]} ${b[1]} L${c[0]} ${c[1]}`;})()}" stroke="#2f4459" stroke-width="3" fill="none"/>`;
// 压力容器顶盖（带法兰螺栓）
plant += cylZ(200,40, 0, 22, 10, '#4a6478','#33495c', C.edge);
plant += cylZ(200,40, 10, 18, 6, '#5a778c','#3d566a', C.edge);
plant += cylZ(200,40, 16, 19, 1.6, '#6a86a0','#45617a', C.edge);
for(let ang=0; ang<12; ang++){
  const a=ang/12*Math.PI*2;
  const p=iso(200+Math.cos(a)*19,40+Math.sin(a)*19,17.8);
  plant += `<circle cx="${p[0]}" cy="${p[1]}" r="1.4" fill="#7a93ad" stroke="#0e1620"/>`;
}
// CRDM 套管阵列
[[-9,0],[0,-9],[9,0],[0,9],[0,0]].forEach(([dx,dy])=>{
  plant += cylZ(200+dx,40+dy, 17.6, 2.2, 12, '#7d95ad','#4d6579', C.edge);
});
document.getElementById('plant').innerHTML = plant;

// 悬停热区（透明矩形盖在设备上方）
const HOT = [
  {id:'hotMotor', x:12,y:26,z:9,r:16, len:28, tip:'<b>驱动电动机</b><br>6kV 厂用电驱动，同轴拖动飞轮与发电机，是机组的动力输入端。'},
  {id:'hotFly', x:49,y:26,z:9,r:19, len:8, tip:'<b>飞轮</b><br>大转动惯量储能。失电后靠惯性维持机组旋转，使发电机短时继续输出，避免控制棒误落。'},
  {id:'hotGen', x:56,y:26,z:9,r:14, len:32, tip:'<b>交流发电机</b><br>由同轴驱动发电，输出三相 380V，经母线送至棒电源柜与逻辑柜。'},
  {id:'hotCab', x:118,y:20,z:0,r:20, len:20, tip:'<b>棒电源柜 / 逻辑柜</b><br>完成整流、配电与步进时序控制，向 CRDM 三组线圈按序供直流电。'},
  {id:'hotVessel', x:200,y:40,z:10,r:24, len:1, tip:'<b>压力容器顶盖</b><br>CRDM 驱动机构装在顶盖套管上，控制棒经驱动杆伸入堆芯。'}
];
plant = '';
HOT.forEach(h=>{
  const c=iso(h.x+h.len/2,h.y,h.z+h.r*0.6);
  plant += `<g class="hot" data-tip="${h.tip.replace(/"/g,'&quot;')}">
    <ellipse cx="${c[0]}" cy="${c[1]}" rx="${(h.r*1.4).toFixed(1)}" ry="${(h.r*0.9).toFixed(1)}" fill="#4da3ff" opacity="0"/>
    <rect x="${c[0]-h.r*1.4}" y="${c[1]-h.r*0.9}" width="${h.r*2.8}" height="${h.r*1.8}" fill="#fff" opacity="0"/>
  </g>`;
});
document.getElementById('plant').innerHTML += plant;

// 标注
function label(x,y,z,text,color){
  const p = iso(x,y,z);
  return `<text x="${p[0]}" y="${p[1]}" font-size="11" fill="${color||'#8ba0bd'}" text-anchor="middle">${text}</text>`;
}
document.getElementById('plantLabels').innerHTML =
  label(25,26,-6,'驱动电动机') + label(51,26,-6,'飞轮') + label(71,26,-6,'交流发电机') +
  label(126,11,-5,'进线柜') + label(127,28,-5,'棒电源柜') + label(127,46,-5,'逻辑柜') +
  label(200,40,32,'压力容器顶盖 / CRDM') +
  `<text x="70" y="150" font-size="10.5" fill="#5f7796">M-G SET</text>`;

/* ================= 运行流程图 ================= */
const FLOW = [
  {k:'厂用电', s:'6kV 带电'}, {k:'机组启动', s:'升速→1500rpm'},
  {k:'发电机建压', s:'380V 50Hz'}, {k:'逻辑柜自检', s:'通道正常'},
  {k:'保持线圈 S', s:'爪吸合'}, {k:'移动线圈 M', s:'挂下一齿'},
  {k:'提升线圈 L', s:'上提 10mm'}, {k:'倒手循环', s:'逐齿提升'},
  {k:'失电检测', s:'飞轮维持'}, {k:'落棒停堆', s:'三爪失磁'}
];
(function buildFlow(){
  const nodes = FLOW.map((f,i)=>{
    const col = i%5, row = Math.floor(i/5);
    const x = 596 + col*104, y = 650 + row*140;
    return `<g id="fn${i}">
      <rect x="${x}" y="${y}" width="92" height="52" rx="7" fill="#0e1a29" stroke="#24384f" stroke-width="1.4"/>
      <text x="${x+46}" y="${y+22}" font-size="11.5" fill="#cfdceb" text-anchor="middle">${f.k}</text>
      <text x="${x+46}" y="${y+38}" font-size="9.5" fill="#5f7796" text-anchor="middle">${f.s}</text>
    </g>`;
  }).join('');
  const arrows = [];
  for(let i=0;i<FLOW.length;i++){
    const col=i%5,row=Math.floor(i/5);
    if(col<4) arrows.push(`<path d="M${596+col*104+92} ${650+row*140+26} H${596+(col+1)*104-4}" stroke="#2f4a68" stroke-width="1.6" marker-end="url(#arw)"/>`);
  }
  arrows.push(`<path d="M${596+4*104+46} ${650+26+52} V${650+140-6}" stroke="#2f4a68" stroke-width="1.6" marker-end="url(#arw)"/>`);
  arrows.push(`<path d="M${596+4*104+46} ${650+140+26} H${596+4*104+40}" stroke="#2f4a68" stroke-width="1.6"/>`);
  document.getElementById('flowNodes').innerHTML = nodes + arrows.join('');
})();

/* ================= 时间轴脚本 ================= */
const SCRIPT=[
 {t:[0,8],title:'设备组成',text:'机组式棒电源是<b>卧式 M-G 机组</b>：驱动电动机、飞轮、交流发电机同轴装在共用底架上；输出三相交流经母线桥架送到棒电源柜与逻辑柜，整流成直流供 CRDM 三组线圈。'},
 {t:[8,16],title:'机组启动',text:'6kV 厂用电投入，电动机拖动同轴机组升速；<b>飞轮随轴储存动能</b>，发电机建压至额定，逻辑柜自检通过进入待命。'},
 {t:[16,26],title:'保持爪抓住驱动杆',text:'<b>保持线圈 S</b> 通直流电，保持爪吸合卡入齿槽，控制棒被提住不下滑。'},
 {t:[26,36],title:'移动爪挂齿',text:'<b>移动线圈 M</b> 通电，移动爪上移挂入上一齿槽；上下双爪交替受力，形成<b>倒手</b>。'},
 {t:[36,46],title:'提升一步',text:'<b>提升线圈 L</b> 通电，驱动杆整体上提一个齿距（约 10mm），棒位与中子注量随之上升。'},
 {t:[46,56],title:'倒手完成',text:'保持爪接住新齿位后 M、L 依次失电复位。<b>提—挂—松循环</b>逐齿提升至目标棒位。'},
 {t:[56,68],title:'失电 · 飞轮维持',text:'厂用电失去，电动机失去动力，<b>飞轮惯性</b>继续拖动发电机：母线仍有电压、线圈电流不中断，棒保持原位不误落。'},
 {t:[68,82],title:'落棒停堆',text:'逻辑柜<b>切断三组线圈电流</b>，双爪失磁释放，控制棒重力落入堆芯，<b>缓冲器</b>吸能——紧急停堆。'},
 {t:[82,92],title:'小结',text:'机组式棒电源靠<b>旋转惯量</b>抵御短时失电，靠<b>失磁落棒</b>保证停堆：既稳住棒，也能果断放开棒。'}
];
const TOTAL = SCRIPT[SCRIPT.length-1].t[1];
let t=0, playing=true, last=performance.now();
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,k)=>a+(b-a)*k;
const seg=vv=>{let i=0;SCRIPT.forEach((s,k)=>{if(vv>=s.t[0])i=k;});return i;};

const tl=$('tl');
SCRIPT.forEach((s,i)=>{const d=document.createElement('div');d.title=s.title;
  d.onclick=()=>{t=s.t[0]+0.01;playing=true;$('btnPlay').textContent='暂停';};tl.appendChild(d);});
const tld=[...tl.children];

/* ================= 波形 ================= */
const cv=$('wave'), cx=cv.getContext('2d');
const hist={L:[],M:[],S:[],V:[]}, HN=120;
function drawWave(){
  const W=cv.width,H=cv.height; cx.clearRect(0,0,W,H);
  cx.strokeStyle='#16233a'; cx.lineWidth=1;
  for(let i=0;i<=4;i++){const y=H/5*i+10; cx.beginPath(); cx.moveTo(0,y); cx.lineTo(W,y); cx.stroke();}
  const series=[['L','#4da3ff'],['M','#ffb020'],['S','#37d67a']];
  series.forEach(([k,c],idx)=>{
    cx.beginPath(); cx.strokeStyle=c; cx.lineWidth=3;
    hist[k].forEach((v,i)=>{
      const x=i/(HN-1)*W, y=H*0.62 - v*(H*0.5) + idx*0;
      i?cx.lineTo(x,y):cx.moveTo(x,y);
    });
    cx.stroke();
  });
  cx.beginPath(); cx.strokeStyle='#8496b0'; cx.lineWidth=2;
  hist.V.forEach((v,i)=>{const x=i/(HN-1)*W,y=H*0.92-v*(H*0.22); i?cx.lineTo(x,y):cx.moveTo(x,y);});
  cx.stroke();
  cx.fillStyle='#5f7796'; cx.font='20px "Noto Sans CJK SC"';
  cx.fillText('L 蓝  M 橙  S 绿  电压 灰',8,H-8);
}

/* ================= 主循环 ================= */
function update(){
  const loss=t>=56&&t<68, drop=t>=68&&t<82, after=t>=82;
  let rpm=0;
  if(t<8)rpm=0; else if(t<16)rpm=lerp(0,1500,(t-8)/8);
  else if(t<56)rpm=1500; else if(loss)rpm=lerp(1500,820,(t-56)/12);
  else rpm=lerp(820,0,clamp((t-68)/12,0,1));
  const volt=rpm>50?Math.round(380*(rpm/1500)):0;
  const energy=clamp(Math.pow(rpm/1500,2)*100,0,100);

  // 飞轮旋转标记
  const spin=$('flySpin');
  if(spin){
    spin.style.transformOrigin=`${(()=>{const c=iso(51.5,26,18);return c[0]+'px '+c[1]+'px';})()}`;
    spin.style.transform=`rotate(${(t*rpm*0.06)%360}deg)`;
  }

  let L=false,M=false,S=false;
  if(t>=16&&t<26)S=true; else if(t>=26&&t<36){S=M=true;}
  else if(t>=36&&t<46){S=M=L=true;} else if(t>=46&&t<56)S=true;
  else if(loss)S=true;

  let rod=30;
  if(t>=26&&t<56)rod=30+(t-26)/30*58; else if(t>=56)rod=88;
  if(drop)rod=lerp(88,4,Math.pow(clamp((t-68)/9,0,1),1.6));
  if(after)rod=4;
  const flux=clamp(100-(100-rod)*1.05,4,100);

  // 剖面动效
  const gl=(id,on)=>{const e=$(id); if(e)e.setAttribute('opacity',on?0.5:0);};
  gl('coilLglow',L); gl('coilMglow',M); gl('coilSglow',S);
  const rodBottom=lerp(902,806,rod/100), rodTop=rodBottom-252;
  $('driveRod').setAttribute('y',rodTop);
  $('teeth').setAttribute('transform',`translate(0,${(rodTop-650)*0.55})`);
  $('claws').setAttribute('transform',`translate(0,${(rodTop-650)*0.33})`);
  const hit=drop?clamp(1-Math.abs(rod-6)/22,0,1):0;
  const buf=$('buffer');
  buf.setAttribute('stroke',hit>0.05?'#ff5c5c':'#4d3a5c');
  buf.setAttribute('fill',hit>0.05?`rgba(255,92,92,${0.2*hit+0.08})`:'#241d2b');
  $('fluxG').setAttribute('opacity',(0.1+flux/100*0.7).toFixed(2));

  // 流程图高亮
  const idx = (()=>{ if(t<8)return 0; if(t<16)return 2; if(t<26)return 4;
    if(t<36)return 5; if(t<46)return 6; if(t<56)return 7; if(loss)return 8; return 9; })();
  FLOW.forEach((f,i)=>{
    const g=$('fn'+i); if(!g)return;
    const r=g.querySelector('rect');
    const on = i===idx;
    r.setAttribute('stroke', on?'#4da3ff':'#24384f');
    r.setAttribute('stroke-width', on?'2.4':'1.4');
    r.setAttribute('fill', on?'#12283f':'#0e1a29');
  });

  // 波形数据
  hist.L.push(L?1:0); hist.M.push(M?1:0); hist.S.push(S?1:0); hist.V.push(volt/380);
  Object.keys(hist).forEach(k=>{ if(hist[k].length>HN) hist[k].shift(); });

  // KPI
  $('vRpm').innerHTML=Math.round(rpm)+'<small>rpm</small>';
  $('vVolt').innerHTML=volt+'<small>V</small>';
  $('vE').innerHTML=Math.round(energy)+'<small>%</small>';
  $('vRod').innerHTML=Math.round(rod)+'<small>%</small>';
  $('vCoil').textContent=`${L?'通':'断'} · ${M?'通':'断'} · ${S?'通':'断'}`;
  $('vFlux').innerHTML=Math.round(flux)+'<small>%</small>';

  const i=seg(t);
  $('capIdx').textContent=`第 ${i+1} 章 / ${SCRIPT.length} · ${SCRIPT[i].title}`;
  $('capTxt').innerHTML=SCRIPT[i].text;
  tld.forEach((d,k)=>d.classList.toggle('on',k<=i));
  $('badgeStage').textContent='阶段：'+SCRIPT[i].title;
  $('clock').textContent=t.toFixed(1)+'s';
  $('scrub').value=t/TOTAL*1000;
}
let frame=0;
function loop(now){
  const dt=Math.min((now-last)/1000,0.1); last=now;
  if(playing){t+=dt; if(t>=TOTAL)t=0;}
  update();
  if(++frame%3===0) drawWave();
  requestAnimationFrame(loop);
}
$('btnPlay').onclick=()=>{playing=!playing;$('btnPlay').textContent=playing?'暂停':'播放';};
$('btnPrev').onclick=()=>{const i=Math.max(0,seg(t)-1);t=SCRIPT[i].t[0]+0.01;};
$('btnNext').onclick=()=>{const i=Math.min(SCRIPT.length-1,seg(t)+1);t=SCRIPT[i].t[0]+0.01;};
$('scrub').oninput=e=>{t=e.target.value/1000*TOTAL;playing=false;$('btnPlay').textContent='播放';};
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();$('btnPlay').click();}});

/* ================= 悬停提示 ================= */
(function(){
  const tip=document.createElement('div'); tip.id='tip'; document.body.appendChild(tip);
  const svg=$('svg');
  function show(e,html){
    tip.innerHTML=html; tip.style.opacity='1';
    const r=tip.getBoundingClientRect();
    let x=e.clientX+14, y=e.clientY-10;
    if(x+r.width>innerWidth-10) x=e.clientX-r.width-14;
    if(y+r.height>innerHeight-10) y=innerHeight-r.height-14;
    tip.style.left=x+'px'; tip.style.top=y+'px';
  }
  svg.querySelectorAll('.hot').forEach(el=>{
    el.addEventListener('mousemove',e=>show(e,el.dataset.tip));
    el.addEventListener('mouseleave',()=>{tip.style.opacity='0';});
  });
})();

/* ================= 导出 PNG ================= */
$('btnPng').onclick=()=>{
  const svgEl=$('svg');
  const clone=svgEl.cloneNode(true);
  // 波形 canvas 是 foreignObject，导出时剔除并换成提示
  clone.querySelectorAll('foreignObject').forEach(f=>{
    const p=f.parentNode;
    const t=document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x',f.getAttribute('x')); t.setAttribute('y',+f.getAttribute('y')+40);
    t.setAttribute('fill','#5f7796'); t.setAttribute('font-size','11');
    t.textContent='（波形请在网页中查看）'; p.appendChild(t); f.remove();
  });
  const xml=new XMLSerializer().serializeToString(clone);
  const url='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(xml);
  const img=new Image();
  img.onload=()=>{
    const c=document.createElement('canvas');
    const scale=2;
    c.width=1440*scale; c.height=980*scale;
    const g=c.getContext('2d');
    g.fillStyle='#070c14'; g.fillRect(0,0,c.width,c.height);
    g.drawImage(img,0,0,c.width,c.height);
    const a=document.createElement('a');
    a.href=c.toDataURL('image/png');
    a.download=`CRDM-棒电源-${SCRIPT[seg(t)].title}.png`;
    a.click();
  };
  img.onerror=()=>alert('导出失败：当前浏览器不支持 SVG 转 PNG');
  img.src=url;
};

window.__anim={set:v=>{t=v;update();drawWave();},total:TOTAL,script:SCRIPT.length};
requestAnimationFrame(loop);
</script>
